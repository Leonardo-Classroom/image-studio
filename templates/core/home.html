{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-semibold">歡迎，{{ user.username }}</h1>
<div class="mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
  <a href="{% url 'text_list' %}" class="rounded-2xl border border-zinc-800 bg-zinc-900/60 p-6 transition hover:border-violet-500/50">
    <h2 class="font-medium">✍️ 文字生成</h2>
    <p class="mt-1 text-sm text-zinc-400">輸入 prompt 直接生成圖片</p>
  </a>
  <a href="{% url 'album_list' %}" class="rounded-2xl border border-zinc-800 bg-zinc-900/60 p-6 transition hover:border-violet-500/50">
    <h2 class="font-medium">📚 專輯總覽</h2>
    <p class="mt-1 text-sm text-zinc-400">依資料集建立專輯、批次生成與瀏覽</p>
  </a>
  <a href="{% url 'album_new' %}" class="rounded-2xl border border-zinc-800 bg-zinc-900/60 p-6 transition hover:border-violet-500/50">
    <h2 class="font-medium">🗂️ 建立專輯</h2>
    <p class="mt-1 text-sm text-zinc-400">從資料集挑選原專輯開始</p>
  </a>
</div>
{% endblock %}
