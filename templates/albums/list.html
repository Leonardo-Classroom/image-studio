{% extends "base.html" %}
{% load static %}
{% block title %}專輯總覽 — 圖像工作室{% endblock %}
{% block content %}
<script src="{% static 'js/overview.js' %}"></script>
<div class="mb-6 flex items-center justify-between">
  <h1 class="text-2xl font-semibold">專輯總覽</h1>
  <a href="{% url 'album_new' %}" class="rounded-lg bg-violet-600 px-4 py-2 font-medium transition hover:bg-violet-500">＋ 建立專輯</a>
</div>

{% if messages %}{% for m in messages %}
<p class="mb-4 rounded-lg bg-emerald-500/10 px-3 py-2 text-sm text-emerald-400">{{ m }}</p>
{% endfor %}{% endif %}

{% include "albums/_overview_grid.html" %}
{% endblock %}
