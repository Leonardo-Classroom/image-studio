{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}圖像工作室{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <style>[x-cloak]{display:none!important}</style>
  <script defer src="{% static 'vendor/htmx.min.js' %}"></script>
  <script defer src="{% static 'vendor/alpine.min.js' %}"></script>
</head>
<body class="h-full bg-zinc-950 text-zinc-100 antialiased" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% if user.is_authenticated %}
  <nav class="sticky top-0 z-40 border-b border-zinc-800 bg-zinc-950/80 backdrop-blur">
    <div class="mx-auto flex h-14 max-w-7xl items-center gap-6 px-4">
      <a href="{% url 'home' %}" class="flex items-center gap-2 font-semibold tracking-wide">
        <span class="inline-block h-2.5 w-2.5 rounded-full bg-violet-500"></span>
        圖像工作室
      </a>
      <div class="hidden items-center gap-4 text-sm text-zinc-400 sm:flex">
        <a href="{% url 'album_list' %}" class="transition hover:text-zinc-200">專輯</a>
        <a href="{% url 'text_list' %}" class="transition hover:text-zinc-200">文字生成</a>
        <a href="{% url 'favorites' %}" class="transition hover:text-zinc-200">最愛</a>
      </div>
      <div class="ml-auto flex items-center gap-4 text-sm text-zinc-400">
        <a href="{% url 'trash' %}" title="回收桶" class="transition hover:text-zinc-200">🗑</a>
        <a href="{% url 'settings' %}" class="transition hover:text-zinc-200">設定</a>
        <span class="hidden sm:inline">{{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="rounded-lg border border-zinc-700 px-3 py-1.5 transition hover:border-zinc-500 hover:text-zinc-200">登出</button>
        </form>
      </div>
    </div>
  </nav>
  {% endif %}
  <main class="{% block main_class %}mx-auto max-w-7xl px-4 py-6{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
